<div class="main-header">
  <a href="{{ '/' | relative_url }}" class="nav-branding-title">
    <strong class="course-code">BSCI238I</strong>
    <span class="course-desc">ML for Life Sciences</span>
  </a>
  
  {% if site.search_enabled != false %}
    <div class="search custom-compact-search" role="search">
      <div class="search-input-wrap">
        <label for="search-input" class="search-label">
          <svg viewBox="0 0 24 24" class="search-icon"><use xlink:href="#svg-search"></use></svg>
        </label>
        <input type="text" id="search-input" class="search-input" tabindex="0" placeholder="Search {{ site.title }}" aria-label="Search {{ site.title }}" autocomplete="off">
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  {% endif %}

  {% if site.aux_links %}
    <nav aria-label="Auxiliary" class="aux-nav">
      <ul class="aux-nav-list">
        {% for link in site.aux_links %}
          <li class="aux-nav-list-item">
            <a href="{{ link[1] }}" class="site-button custom-nav-btn" data-target="{{ link[1] }}">
              {{ link[0] }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  {% endif %}
</div>

<script>
  (function() {
    const ACTIVE_COLOR = '#d97706';
    const INACTIVE_COLOR = '#4b5563';

    function styleLink(link, isActive) {
      if (isActive) {
        link.style.setProperty('color', ACTIVE_COLOR, 'important');
        link.style.setProperty('border-bottom', '2px solid ' + ACTIVE_COLOR, 'important');
        link.style.setProperty('font-weight', '600', 'important');
      } else {
        link.style.setProperty('color', INACTIVE_COLOR, 'important');
        link.style.setProperty('border-bottom', '2px solid transparent', 'important');
        link.style.setProperty('font-weight', '500', 'important');
      }
    }

    function initNavHighlight() {
      const links = Array.from(document.querySelectorAll('.custom-nav-btn'));
      if (!links.length) return;

      function highlight(selected) {
        links.forEach(link => styleLink(link, link === selected));
      }

      links.forEach(link => {
        link.addEventListener('click', function() {
          highlight(this);
        });
      });

      function syncHash() {
        const hash = (window.location.hash || '').toLowerCase();
        let matched = null;

        if (hash) {
          matched = links.find(link => {
            const target = (link.getAttribute('data-target') || link.getAttribute('href') || '').toLowerCase();
            return target === hash || target.endsWith(hash);
          });
        }

        if (!matched) {
          matched = links.find(link => link.textContent.trim().toLowerCase() === 'home') || links[0];
        }

        highlight(matched);
      }

      window.addEventListener('hashchange', syncHash);
      syncHash();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initNavHighlight);
    } else {
      initNavHighlight();
    }
  })();
</script>

<script>
  const activeSemesters = new Set(['fall-2025', 'spring-2026']);

  function toggleSemester(sem) {
    const btn = document.querySelector(`.sem-toggle-btn[data-sem="${sem}"]`);

    if (activeSemesters.has(sem)) {
      if (activeSemesters.size > 1) {
        activeSemesters.delete(sem);
        btn.classList.remove('active-sem');
      }
    } else {
      activeSemesters.add(sem);
      btn.classList.add('active-sem');
    }

    const cards = document.querySelectorAll('.animated-project-card');
    cards.forEach(card => {
      const cardSem = card.getAttribute('data-semester');
      card.style.display = activeSemesters.has(cardSem) ? 'flex' : 'none';
    });
  }
</script>
