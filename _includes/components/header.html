<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<div class="main-header">
  
  <a href="#" class="nav-branding-title">BSCI238I: ML for Life Sciences</a>

  {% if site.search_enabled != false %}
    <div class="search" role="search">
      <div class="search-input-wrap">
        <input type="text" id="search-input" class="search-input" tabindex="0" placeholder="Search {{ site.title }}" aria-label="Search {{ site.title }}" autocomplete="off">
        <label for="search-input" class="search-label"><svg viewBox="0 0 24 24" class="search-icon"><use xlink:href="#svg-search"></use></svg></label>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  {% endif %}

  {% if site.aux_links %}
    <nav aria-label="Auxiliary" class="aux-nav">
      <ul class="aux-nav-list">
        {% for link in site.aux_links %}
          <li class="aux-nav-list-item">
            <a href="{{ link[1] }}" class="site-button" {% if site.aux_links_new_tab %}target="_blank" rel="noopener noreferrer"{% endif %}>
              {{ link[0] }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  {% endif %}

</div>

<style>
  /* GLOBAL BULLETPROOF THEME OVERRIDES */
  
  /* 1. Force all calendar table links to turn Blueprint Blue */
  .day-topic a,
  .day-resources a,
  .main-content td a,
  .table-wrapper td a,
  tr td a {
      color: #317b91 !important;
      text-decoration: none !important;
  }
  
  /* 2. Force hover state for calendar links */
  .day-topic a:hover,
  .day-resources a:hover,
  tr td a:hover {
      color: #215666 !important;
      text-decoration: underline !important;
  }
  
  /* 3. Force purple calendar badges (SECTION and LAB) to turn Blueprint Blue */
  .badge-purple,
  [class*="badge-purple"],
  .badge,
  span.badge {
      background-color: #317b91 !important;
      color: #ffffff !important;
  }
  
  /* 4. Ensure HW Due badges stay their intentional deadline red */
  .badge-red,
  [class*="badge-red"] {
      background-color: #c6513e !important;
      color: #ffffff !important;
  }
</style>
